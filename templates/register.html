{% extends "base.html" %}

{% block title %}Register - TrekOps{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">Create an Account</h4>
                <p class="text-muted small">Register as a Trekker or Trek Staff member</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label fw-semibold">Register As</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="user" selected>Trekker (Standard User)</option>
                        <option value="staff">Trek Staff (Requires Admin Approval)</option>
                    </select>
                    <div class="form-text mt-1 text-muted" id="roleHelp">
                        <i class="bi bi-info-circle me-1"></i> Trek Staff accounts start in 'pending' status until approved by an Admin.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                    <i class="bi bi-person-plus me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="mb-0 text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
